# Example site config for nginx (put inside the http {} block, e.g. conf.d/pulse.conf).
# TLS is terminated here; the app listens on 127.0.0.1:3000.
# Requires: TRUST_PROXY=1 and COOKIE_SECURE=1 in the app environment.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream pulse_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name pulse.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name pulse.example.com;

  ssl_certificate     /etc/letsencrypt/live/pulse.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pulse.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Project imports are capped at 2 MB in the app; leave framing headroom.
  client_max_body_size 3m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://pulse_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # WebSocket upgrades (/ws) and SSE (/api/events).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
