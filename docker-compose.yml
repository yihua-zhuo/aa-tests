name: pulse

services:
  app:
    build: .
    image: pulse:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      DB_PATH: /app/data/pulse.db
      NODE_ENV: production
    ports:
      # Only expose to the host loopback; terminate TLS in front of this.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
