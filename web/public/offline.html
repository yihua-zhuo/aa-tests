<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8065e9" />
    <title>离线 — Clay Dashboard</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f2fc;
        color: #172443;
        font:
          16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 36px 32px;
        border-radius: 26px;
        background: #fff;
        box-shadow:
          0 2px 4px rgba(90, 70, 160, 0.03),
          0 26px 52px -34px rgba(90, 70, 160, 0.4);
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: linear-gradient(160deg, #a78bfa, #8065e9);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 22px;
        color: #62627a;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 26px;
        background: #8065e9;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>当前处于离线状态</h1>
      <p>应用外壳已缓存，但页面资源尚未准备好。恢复网络后点击重试即可继续。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
